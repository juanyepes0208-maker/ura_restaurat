<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ura - Ingreso</title>
    <link rel="icon" href="../imgs/userIcon.png">
    <link rel="stylesheet" href="../css/ingreso.css">
</head>
<body>
    <form action="" method="post">
        <h1>Bienvenido</h1>
        <div class="inputGroup">
            <label for="user">Usuario</label>
            <div class="input">
                <input type="text" name="user" id="user" placeholder="Digita tu usuario">
                <img src="../imgs/userIcon.png" alt="Icono de usuario" width="900" height="500">
            </div>
        </div>

        <div class="inputGroup">
            <label for="password">Clave</label>
            <div class="input">
                <input type="password" name="password" id="password" placeholder="Digita tu clave">
                <img src="../imgs/passwordIcon.png" alt="Icono de password" width="920" height="512">
            </div>
        </div>

        <button type="submit">Ingresar</button>
        <div class="noAccount">
            <a id="noAccount" href="#">Si no tienes cuenta, click aqui</a>
        </div>
    </form>
    <script src="../js/noAccount.js"></script>
</body>
</html>
